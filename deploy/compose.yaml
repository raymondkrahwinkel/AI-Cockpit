# AC-1356: the headless Cockpit on a plain Docker host. The image is pinned by COCKPIT_TAG (a `sha-<commit>` tag, with no
# default and never `latest`): a restart drops live agent sessions, so nothing here pulls on its own.
# The GHCR package is private: `docker login ghcr.io` on the host first (see README.md).
name: cockpit

services:
  cockpit:
    image: ${COCKPIT_IMAGE:-ghcr.io/raymondkrahwinkel/cockpit-server}:${COCKPIT_TAG:?set COCKPIT_TAG to a sha-<commit> tag}
    # Reaps the children an agent session leaves behind.
    init: true
    restart: unless-stopped
    environment:
      COCKPIT_STATE_ROOT: /state
      COCKPIT_UNLOCK_PASSWORD_FILE: /run/secrets/cockpit_unlock_password
      COCKPIT_CONNECT_KEY_FILE: /run/secrets/cockpit_connect_key
      COCKPIT_STOP_BUDGET_SECONDS: ${COCKPIT_STOP_BUDGET_SECONDS:-8}
      # AC-1464: a blank clone or worktree root takes these, since agent sessions cannot enter /state.
      COCKPIT_CLONE_ROOT: /work/clones
      COCKPIT_WORKTREE_ROOT: /work/worktrees
    # Sessions inherit this (GH_TOKEN, AIHUB_*, ...). Optional, so a host with nothing to pass needs no file.
    env_file:
      - path: ${COCKPIT_SESSION_ENV_FILE:-./session.env}
        required: false
    secrets:
      - cockpit_unlock_password
      - cockpit_connect_key
    ports:
      - "${COCKPIT_PORT:-20383}:20383"
    # AC-1466: /healthz needs no key; node is in the image, curl and wget are not. No certificate check, because this
    # talks only to the container's own loopback and its self-signed certificate: never copy it for a remote check.
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get({host:'127.0.0.1',port:20383,path:'/healthz',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Longer than COCKPIT_STOP_BUDGET_SECONDS, so the server's own stop finishes before docker kills it.
    stop_grace_period: 15s
    # AC-1464: the entrypoint copies the secrets here for the server alone, so they never touch the container's layer.
    tmpfs:
      - /run/cockpit:mode=0700
    volumes:
      - state:/state
      # The CLIs run as `agent` and write their logins and transcripts here; the server reads the same volume on
      # its own home. Two mounts of one volume, so neither user needs a path into the other's home.
      - claude:/home/agent/.claude
      - claude:/home/app/.claude
      - codex:/home/agent/.codex
      - codex:/home/app/.codex
      # The server's SSH keys (clones), and the agent's own (its pushes): ssh refuses a key another user can read.
      - ssh:/home/app/.ssh
      - agent-ssh:/home/agent/.ssh
      # Clones and worktrees, writable for the server and the agent alike; /state is the server's alone.
      - work:/work

secrets:
  cockpit_unlock_password:
    file: ${COCKPIT_UNLOCK_PASSWORD_PATH:-./secrets/unlock-password}
  cockpit_connect_key:
    file: ${COCKPIT_CONNECT_KEY_PATH:-./secrets/connect-key}

volumes:
  state:
  claude:
  codex:
  ssh:
  agent-ssh:
  work:

# AC-1356: the headless Cockpit on a plain Docker host. The image is pinned by COCKPIT_TAG (a `sha-<commit>` tag, with no
# default and never `latest`): a restart drops live agent sessions, so nothing here pulls on its own.
name: cockpit

services:
  cockpit:
    image: ${COCKPIT_IMAGE:-ghcr.io/raymondkrahwinkel/cockpit-server}:${COCKPIT_TAG:?set COCKPIT_TAG to a sha-<commit> tag}
    # Reaps the children an agent session leaves behind.
    init: true
    restart: unless-stopped
    environment:
      COCKPIT_STATE_ROOT: /state
      COCKPIT_CONNECT_KEY_FILE: /run/secrets/cockpit_connect_key
      COCKPIT_STOP_BUDGET_SECONDS: ${COCKPIT_STOP_BUDGET_SECONDS:-8}
      # AC-1493: the profile fallback for a projectless session; `app` cannot read this agent-owned mount.
      COCKPIT_DEFAULT_WORKING_DIRECTORY: /home/agent/scratch
      # AC-1464: a blank clone or worktree root takes these, since agent sessions cannot enter /state.
      COCKPIT_CLONE_ROOT: /work/clones
      COCKPIT_WORKTREE_ROOT: /work/worktrees
      # AC-1470: the image this container runs, which an operate key reads in GET /api/v1/health.
      COCKPIT_IMAGE_REF: ${COCKPIT_IMAGE:-ghcr.io/raymondkrahwinkel/cockpit-server}:${COCKPIT_TAG}
    secrets:
      - cockpit_connect_key
      # AC-1464: what the sessions inherit (GH_TOKEN, AIHUB_*, ...), KEY=VALUE per line; may be empty. A file rather than
      # an env_file, so it reaches only the server and its sessions, not the container's environment that `docker exec`
      # and the health check run with.
      - cockpit_session_env
    ports:
      - "${COCKPIT_PORT:-20383}:20383"
    # AC-1466: /healthz needs no key; node is in the image, curl and wget are not. No certificate check, because this
    # talks only to the container's own loopback and its self-signed certificate: never copy it for a remote check.
    # AC-1464: Docker runs it as the container's user, root, so it drops to app with an empty environment first.
    healthcheck:
      test: ["CMD", "/usr/bin/setpriv", "--reuid=app", "--regid=app", "--init-groups", "--", "/usr/bin/env", "-i", "/usr/local/bin/node", "-e", "require('https').get({host:'127.0.0.1',port:20383,path:'/healthz',rejectUnauthorized:false},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Longer than COCKPIT_STOP_BUDGET_SECONDS, so the server's own stop finishes before docker kills it.
    stop_grace_period: 15s
    # AC-1464: the entrypoint copies the secrets here for the server alone, so they never touch the container's layer.
    tmpfs:
      - /run/cockpit:mode=0700
    volumes:
      - state:/state
      - scratch:/home/agent/scratch
      # The CLIs run as `agent` and write their logins and transcripts here; the server reads the same volume on
      # its own home. Two mounts of one volume, so neither user needs a path into the other's home.
      - claude:/home/agent/.claude
      - claude:/home/app/.claude
      - codex:/home/agent/.codex
      - codex:/home/app/.codex
      # The server's SSH keys (clones), and the agent's own (its pushes): ssh refuses a key another user can read.
      - ssh:/home/app/.ssh
      - agent-ssh:/home/agent/.ssh
      # Clones and worktrees, writable for the server and the agent alike; /state is the server's alone.
      - work:/work
      # AC-1364: the brain, kept by brain-sync, at the path Me.md has on the desktop.
      - brain:/home/agent/Nextcloud
    # AC-1364: which brain file is which assistant, read-only for the CLIs (claude and codex alike).
    configs:
      - source: brain_instructions
        target: /home/agent/.claude/CLAUDE.md
      - source: brain_instructions
        target: /home/agent/.codex/AGENTS.md

  # AC-1364: bisyncs the brain (an include list of the AI-OS tree in Nextcloud) into the `brain` volume. It runs as
  # agent's uid, so sessions write their notes back; the app password is this container's alone, never the cockpit's.
  brain-sync:
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    init: true
    restart: unless-stopped
    user: "1700:1700"
    entrypoint: ["/bin/sh", "/etc/brain-sync/brain-sync.sh"]
    environment:
      BRAIN_SYNCS: ${COCKPIT_BRAIN_SYNCS:-nc:Notes/AI-OS=Nextcloud/Notes/AI-OS}
      BRAIN_SYNC_INTERVAL: ${COCKPIT_BRAIN_SYNC_INTERVAL:-60}
      # Percent of the files one run may delete on either side; more stops the run (README.md).
      BRAIN_SYNC_MAX_DELETE: ${COCKPIT_BRAIN_SYNC_MAX_DELETE:-10}
    configs:
      - source: brain_sync_script
        target: /etc/brain-sync/brain-sync.sh
      - source: brain_filter_nc
        target: /etc/brain-sync/nc.filter
    secrets:
      - cockpit_brain_rclone
    volumes:
      - brain:/data/Nextcloud
      # The bisync listings: this container's alone, never mounted where a session runs.
      - brain-state:/bisync
    depends_on:
      brain-init:
        condition: service_completed_successfully

  # A new volume is root's; this hands both to agent's uid, owner-only, so brain-sync itself never runs as root and
  # the server (app, in agent's group) cannot read the brain.
  brain-init:
    image: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 1700:1700 /data/Nextcloud /bisync && chmod -R go= /data/Nextcloud /bisync"]
    volumes:
      - brain:/data/Nextcloud
      - brain-state:/bisync

configs:
  brain_sync_script:
    file: ./brain-sync.sh
  brain_filter_nc:
    file: ${COCKPIT_BRAIN_FILTER_PATH:-./brain-filter.txt}
  brain_instructions:
    file: ${COCKPIT_BRAIN_INSTRUCTIONS_PATH:-./brain-instructions.md}

secrets:
  cockpit_connect_key:
    file: ${COCKPIT_CONNECT_KEY_PATH:-./secrets/connect-key}
  cockpit_session_env:
    file: ${COCKPIT_SESSION_ENV_FILE:-./session.env}
  # AC-1364: an rclone.conf with the Nextcloud app password; readable by uid 1700 (README.md).
  cockpit_brain_rclone:
    file: ${COCKPIT_BRAIN_RCLONE_PATH:-./secrets/brain-rclone.conf}

volumes:
  state:
  claude:
  codex:
  ssh:
  agent-ssh:
  scratch:
  work:
  brain:
  brain-state:

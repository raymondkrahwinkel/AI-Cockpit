name: Server image

# Build and smoke the successful Nightly's commit before publishing it for servers following :main.
# Release tags and manual runs remain available; a push to main alone never starts an image build.
on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  image:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/raymondkrahwinkel/cockpit-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Image revision
        id: revision
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: cockpit-server:smoke
          cache-from: type=gha

      - name: Container smoke
        run: deploy/smoke.sh cockpit-server:smoke

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ steps.revision.outputs.short_sha }}

      # The image that was smoked, retagged: a second build could differ in what the Dockerfile leaves unpinned.
      - name: Push the smoked image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag cockpit-server:smoke "$tag"
            docker push "$tag"
          done

      - name: Dev metadata
        id: meta-dev
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
          flavor: |
            latest=false
            suffix=-dev
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=sha-${{ steps.revision.outputs.short_sha }}

      # The SDK variant for agents that build and test; built and pushed so a broken `dev` stage shows.
      - name: Build the dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          push: true
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha

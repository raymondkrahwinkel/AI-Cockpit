name: Server image

# AC-1356: builds the headless Cockpit image, smokes it as a container, and only then pushes it to GHCR as
# :<branch> and :sha-<commit>. The deploy tag is the sha one; a host never pulls :main on its own.
# A pull request builds and smokes without logging in or pushing.
on:
  push:
    branches: [main]
    paths: ['src/**', 'plugins-dev/**', 'Dockerfile', '.dockerignore', 'deploy/**', 'tests/Cockpit.ServerSeed/**', 'Directory.Build.*', 'Directory.Packages.props', 'global.json', 'nuget.config', '.github/workflows/server-image.yml']
  pull_request:
    paths: ['src/**', 'plugins-dev/**', 'Dockerfile', '.dockerignore', 'deploy/**', 'tests/Cockpit.ServerSeed/**', 'Directory.Build.*', 'Directory.Packages.props', 'global.json', 'nuget.config', '.github/workflows/server-image.yml']
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/raymondkrahwinkel/cockpit-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - uses: docker/setup-buildx-action@v4

      - name: Build the runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: cockpit-server:smoke
          cache-from: type=gha

      - name: Container smoke
        run: deploy/smoke.sh cockpit-server:smoke

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Runtime metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # The image that was smoked, retagged: a second build could differ in what the Dockerfile leaves unpinned.
      - name: Push the smoked image
        if: github.event_name != 'pull_request'
        run: |
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker tag cockpit-server:smoke "$tag"
            docker push "$tag"
          done

      - name: Dev metadata
        id: meta-dev
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: suffix=-dev
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      # The SDK variant for agents that build and test; built (and pushed outside a pull request) so a broken `dev` stage shows.
      - name: Build the dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dev
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-dev.outputs.tags }}
          labels: ${{ steps.meta-dev.outputs.labels }}
          cache-from: type=gha

name: AC-2029 Linux browser proof

on:
  push:
    branches: [feature/AC-2029-linux-browser-repro]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Browser and SDK versions
        run: |
          google-chrome --version
          dotnet --version
      - name: Allow the Chromium sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build browser test project
        run: dotnet build plugins-dev/Cockpit.Plugin.Browser.Tests/Cockpit.Plugin.Browser.Tests.csproj --configuration Release -warnaserror
      - name: Targeted browser test
        run: dotnet test plugins-dev/Cockpit.Plugin.Browser.Tests/Cockpit.Plugin.Browser.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~TwoSessions_OpenListReadAndCapture_WithoutReplacingTheirTabs --logger trx --logger "console;verbosity=normal" --results-directory TestResults --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ac-2029-browser-proof
          path: TestResults

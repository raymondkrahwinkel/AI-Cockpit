name: Nightly

# A testable build of main (#71), published to one rolling pre-release tagged 'nightly' that is overwritten each
# time. Opting in to nightlies is a choice about which channel you follow, so this is deliberately a
# *pre-release*: a stable channel never sees it.
#
# It does not run on every push. It runs at night, and only when something actually changed since the last one —
# a nightly that is byte-for-byte yesterday's is noise — or whenever you fire it by hand from the Actions tab.
#
# A nightly has no version number to compare (that is what a rolling tag means), so its identity is the commit it
# was built from: <VersionPrefix>-nightly.<run>+<sha>, e.g. 0.3.0-nightly.42+abc1234. "Is there something newer?"
# is answered by the run number; "which nightly am I running?" by the sha, which is the question you actually ask
# when one misbehaves. The version comes from MSBuild rather than being written here, so it cannot drift from what
# the app is.
on:
  schedule:
    # 02:00 UTC — the small hours in Amsterdam, whichever side of daylight saving we are on.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing new on main since the last nightly means there is nothing to build. A manual run always builds:
  # firing it by hand is itself the statement that you want this commit built.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      previous: ${{ steps.decide.outputs.previous }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The commit the nightly tag points at — not the release's targetCommitish, which reports the branch
          # ("main") and would never equal a sha, quietly making this check always say "yes, build". Captured
          # here, before the manual short-circuit below, so the release job can list the commits since it as
          # this nightly's changelog on a scheduled and a hand-fired run alike.
          published=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || echo "")
          echo "previous=$published" >> "$GITHUB_OUTPUT"
          head=$(git rev-parse HEAD)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run — building this commit."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$published" = "$head" ]; then
            echo "main is unchanged since the last nightly ($head) — nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved since the last nightly (was '$published', now '$head')."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Build host tests
        run: dotnet build Cockpit.slnx --configuration Release -warnaserror

      - name: Build plugin tests
        run: dotnet build PluginTests.slnx --configuration Release -warnaserror

      - name: Build plugins without tests
        run: |
          for plugin in plugins-dev/Cockpit.Plugin.*/; do
            case "$plugin" in *.Tests/) continue;; esac
            if grep -qF "$(basename "$plugin")/" PluginTests.slnx; then continue; fi
            dotnet build "$plugin" --configuration Release -warnaserror
          done

      - name: Core tests
        run: dotnet test tests/Cockpit.Core.Tests/Cockpit.Core.Tests.csproj --configuration Release --no-build --logger trx --logger "console;verbosity=minimal" --results-directory TestResults/Core --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Infrastructure tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Cockpit.Infrastructure.Tests/Cockpit.Infrastructure.Tests.csproj --configuration Release --no-build --logger trx --logger "console;verbosity=minimal" --results-directory TestResults/Infrastructure --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: View tests
        if: ${{ !cancelled() }}
        run: dotnet test tests/Cockpit.App.ViewTests/Cockpit.App.ViewTests.csproj --configuration Release --no-build --logger trx --logger "console;verbosity=minimal" --results-directory TestResults/View --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Plugin tests
        if: ${{ !cancelled() }}
        run: dotnet test PluginTests.slnx --configuration Release --no-build --logger trx --logger "console;verbosity=minimal" --results-directory TestResults/Plugins --collect:"XPlat Code Coverage" --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      - name: Test and coverage summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import os
          import xml.etree.ElementTree as ET

          root = pathlib.Path("TestResults")
          rows = []
          errors = []
          expected_names = {
              "Cockpit.Core.Tests",
              "Cockpit.Infrastructure.Tests",
              "Cockpit.App.ViewTests",
          }
          expected_names.update(path.stem for path in pathlib.Path("plugins-dev").glob("Cockpit.Plugin.*.Tests/*.csproj"))
          expected = {name.casefold(): name for name in expected_names}
          for trx in sorted(root.rglob("*.trx")):
              tree = ET.parse(trx)
              units = tree.findall(".//{*}UnitTest")
              storage = units[0].get("storage", "") if units else ""
              raw_project = pathlib.Path(storage).stem or trx.stem
              project = expected.get(raw_project.casefold(), raw_project)
              counters = tree.find(".//{*}Counters")
              if counters is None:
                  errors.append(f"{trx}: missing test counters")
                  continue
              passed = int(counters.get("passed", 0))
              failed = int(counters.get("failed", 0))
              skipped = int(counters.get("notExecuted", 0))
              if passed == 0:
                  errors.append(f"{project}: no passing tests")

              coverage = "N/A"
              reports = list(trx.parent.rglob("coverage.cobertura.xml"))
              if trx.parent.name == "Plugins":
                  production = project.removesuffix(".Tests").casefold()
                  reports = [
                      report for report in reports
                      if production in {
                          package.get("name", "").casefold()
                          for package in ET.parse(report).findall(".//{*}package")
                      }
                  ]
              if len(reports) == 1:
                  report = reports[0]
                  coverage = f'{float(ET.parse(report).getroot().get("line-rate", 0)):.1%}'
              if coverage == "N/A":
                  errors.append(f"{project}: missing coverage report")
              rows.append((project, passed, failed, skipped, coverage))

          reported = {row[0].casefold() for row in rows}
          for missing in sorted(expected - reported):
              errors.append(f"{expected[missing]}: no test result")
          if not rows:
              errors.append("No test results found")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Tests and coverage\n\n")
              summary.write("| Project | Passed | Failed | Skipped | Line coverage |\n")
              summary.write("|---|---:|---:|---:|---:|\n")
              for row in sorted(rows):
                  summary.write(f"| {row[0]} | {row[1]} | {row[2]} | {row[3]} | {row[4]} |\n")
              if errors:
                  summary.write("\n" + "\n".join(f"- {error}" for error in errors) + "\n")
          if errors:
              raise SystemExit("; ".join(errors))
          PY

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-results
          path: TestResults
          if-no-files-found: error

  publish:
    needs: [changes, test]
    if: needs.changes.outputs.build == 'true' && needs.test.result == 'success'

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Ask MSBuild what the version is instead of grepping the XML for it: the first attempt matched the
      # <VersionPrefix> mentioned in a comment rather than the property, and -P does not exist in macOS's grep
      # at all. The build system already knows the answer.
      - name: Build the nightly version string
        id: version
        shell: bash
        run: |
          base=$(dotnet msbuild src/Cockpit.App/Cockpit.App.csproj -getProperty:VersionPrefix | tr -d '[:space:]')
          echo "version=${base}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Self-contained: nobody should have to install a .NET runtime to try a nightly. A directory publish on every
      # platform — the updater replaces an application *folder*, so it needs the files as files, and a
      # self-extracting single exe defeats that (AC-384). Not trimmed: trimming is what actually breaks Avalonia's
      # reflection-driven XAML loading.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cockpit.App/Cockpit.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:SourceRevisionId=${{ steps.version.outputs.sha }} \
            --output publish/${{ matrix.rid }}

      # One thing per platform, and it is the thing you actually run: a Setup.exe on Windows (built further down,
      # from this directory publish, by vpk), a .app on macOS, an AppImage on Linux (below). The tarball rides
      # along for Linux only, where unpacking a directory on a server is a real use — a zip of loose DLLs is not
      # something anybody wants to be handed.
      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.rid }}" in
            osx-arm64)
              scripts/package-macos.sh arm64 "${{ steps.version.outputs.version }}"

              # The .dmg is what a person downloads: open, drag onto Applications, done. The zipped bundle stays
              # beside it because that is what automation wants — a tool that has to unpack a disk image first is
              # a tool nobody writes.
              mv artifacts/macos/*.dmg "artifacts/ai-cockpit-nightly-macos-arm64.dmg"

              # ditto, not zip: it keeps the bundle's symlinks and permissions, and a .app that lost its
              # executable bit is a .app that will not open.
              ditto -c -k --sequesterRsrc --keepParent \
                artifacts/macos/AI-Cockpit.app "artifacts/ai-cockpit-nightly-macos-arm64.app.zip"
              rm -rf artifacts/macos
              ;;
            linux-x64)
              tar -czf "artifacts/ai-cockpit-nightly-linux-x64.tar.gz" -C publish/linux-x64 .
              ;;
          esac

      # An AppImage as well as the tarball, and not instead of it: the tarball is what you unpack on a server or
      # feed to a package build, the AppImage is what a person double-clicks. Built from the publish that already
      # happened, so both artifacts are the same bytes.
      - name: AppImage
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          scripts/package-appimage.sh publish/linux-x64 "${{ steps.version.outputs.version }}"
          mv artifacts/appimage/*.AppImage "artifacts/ai-cockpit-nightly-x86_64.AppImage"
          rm -rf artifacts/appimage

      # The Velopack feed for the nightly channels — the same packing the release does, on -nightly rather than
      # -stable, so somebody following nightlies is offered nightlies and never a stable build (AC-384). Same
      # pinned tool version, because the tool writes the feed the app's Velopack library reads.
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Build the macOS icon
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          iconset=AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size src/Cockpit.App/Assets/AppIcon.png --out "$iconset/icon_${size}x${size}.png"
            sips -z $((size * 2)) $((size * 2)) src/Cockpit.App/Assets/AppIcon.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o AppIcon.icns

      - name: Pack the Velopack release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          case "$RID" in
            win-x64)   platform=win;   main_exe=Cockpit.App.exe; icon=src/Cockpit.App/Assets/AppIcon.ico ;;
            osx-arm64) platform=osx;   main_exe=Cockpit.App;     icon=AppIcon.icns ;;
            linux-x64) platform=linux; main_exe=Cockpit.App;     icon=src/Cockpit.App/Assets/AppIcon.png ;;
          esac

          EXTRA=()
          if [ "$platform" = "linux" ]; then
            EXTRA+=(--categories "Development;System")
          fi

          # ${EXTRA[@]+"${EXTRA[@]}"}: bash 3.2 on the macOS runners treats an empty array expansion as unbound.
          #
          # --noDefaultExclude: vpk pack silently drops createdump from every package it builds otherwise (its
          # built-in exclude list, undocumented outside `vpk pack -H`) — the AppImage and nupkg it produces here
          # are what auto-update actually installs, so that silent drop is what left every packaged build unable
          # to write a heap dump (AC-989). The --exclude default (.*\.pdb) keeps stripping debug symbols either
          # way, since that is a separate, explicit option.
          vpk pack ${EXTRA[@]+"${EXTRA[@]}"} \
            --noDefaultExclude \
            --packId AI-Cockpit \
            --packTitle "Wispslate Cockpit" \
            --packAuthors "Raymond Krahwinkel" \
            --packVersion "$VERSION" \
            --packDir "publish/$RID" \
            --mainExe "$main_exe" \
            --icon "$icon" \
            --channel "$platform-nightly" \
            --outputDir artifacts-velopack

          # Guards the fix above: a package missing createdump is otherwise indistinguishable from a healthy one
          # until someone tries to collect a dump and gets a silent "Complete" (AC-989). Windows has no
          # createdump (dotnet-dump uses MiniDumpWriteDump there), so this only runs for linux/osx. The portable
          # artifact is checked rather than the full nupkg: on Linux the nupkg embeds the whole AppImage as one
          # opaque file, so its own extractor is the only way in; on macOS the portable zip is a flat listing.
          case "$platform" in
            linux)
              appimage="artifacts-velopack/AI-Cockpit-linux-nightly.AppImage"
              chmod +x "$appimage"
              rm -rf squashfs-root
              "$appimage" --appimage-extract usr/bin/createdump >/dev/null
              found=$([ -x squashfs-root/usr/bin/createdump ] && echo 1 || echo 0)
              rm -rf squashfs-root
              ;;
            osx)
              found=$(unzip -l "artifacts-velopack/AI-Cockpit-osx-nightly-Portable.zip" | grep -c "createdump" || true)
              ;;
          esac
          if [ "$platform" != "win" ] && [ "$found" = "0" ]; then
              echo "createdump is missing from the $platform package — .NET crash dumps would silently fail (AC-989)." >&2
              exit 1
          fi

      # The plugin SDK for the contract this build actually carries, so an out-of-repo author can follow main
      # rather than wait for a release. Packed on the Linux leg only: a library package is platform-independent.
      # The run number becomes a prerelease suffix (1.27.0-nightly.42) because NuGet caches a package by
      # id+version — re-publishing changed bytes as plain 1.27.0 every night would restore from cache and be
      # silently stale, and the suffix also says out loud that this contract is not a released one.
      - name: Plugin SDK
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: scripts/pack-sdk.sh artifacts "nightly.${GITHUB_RUN_NUMBER}"

      # Hand the build to the release job rather than publishing from here. Three jobs each uploading into one
      # rolling release means a platform that fails leaves its predecessor's bytes sitting next to the others:
      # the release page then looks complete while being a mixture of two builds, which is worse than a nightly
      # that visibly failed.
      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.rid }}
          # Two roots, so the Velopack feed keeps its own directory all the way to the release job rather than
          # being flattened in among the plugin SDK's package.
          path: |
            artifacts/*
            artifacts-velopack/*
          retention-days: 2

  # One publish, after every platform built. All three or none.
  release:
    needs: [changes, publish]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the changelog can walk from the previous nightly's commit to this one.
          fetch-depth: 0

      # Unpacked at the workspace root, because each platform's artifact carries both directories: artifacts/ and
      # artifacts-velopack/. Neither exists in the checkout, so nothing of the repository is written over.
      - uses: actions/download-artifact@v8
        with:
          path: .
          merge-multiple: true

      - name: Version
        id: version
        shell: bash
        run: |
          base=$(dotnet msbuild src/Cockpit.App/Cockpit.App.csproj -getProperty:VersionPrefix | tr -d '[:space:]')
          echo "version=${base}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Build the release body as a file rather than an inline --notes string: the changelog is a bullet list,
      # and this YAML block's indentation would prepend leading spaces to every line, turning the list into a
      # markdown code block. A file sidesteps that. The changelog is the commits since the previous nightly —
      # the question a rolling pre-release actually raises: what landed in tonight's build. The previous
      # nightly's commit comes from the `changes` job (its sha, not the 'nightly' tag name, because this job
      # deletes and recreates that tag below). A previous sha that is missing or no longer in history (the very
      # first nightly, a pruned tag, or a rewritten main) falls back to the most recent commits so the body is
      # never empty.
      - name: Compose the release notes
        shell: bash
        run: |
          previous="${{ needs.changes.outputs.previous }}"
          {
            echo "Rolling build of \`main\`, replaced whenever main moves. Not a release: things here are expected to break."
            echo
            echo "Version: \`${{ steps.version.outputs.version }}\` · commit \`${{ steps.version.outputs.sha }}\`"
            echo
            echo "### Changes since the previous nightly"
            echo
            if [ -n "$previous" ] && git cat-file -e "${previous}^{commit}" 2>/dev/null; then
              bash scripts/nightly-notes.sh "${previous}..HEAD"
            else
              echo "_No previous nightly in history — the most recent commits:_"
              echo
              bash scripts/nightly-notes.sh -n 20
            fi
            echo
            echo "---"
            echo
            echo "**macOS — install with this, not the .dmg:** \`curl -fsSL https://raw.githubusercontent.com/raymondkrahwinkel/AI-Cockpit/main/scripts/install-macos.sh | bash -s -- nightly\`"
            echo
            echo "The build is ad-hoc signed, not notarized, so a copy your *browser* fetched is quarantined and Gatekeeper calls it \"damaged and can't be opened\". It is not damaged — that flag is written by the downloader, and \`curl\` does not write one. Already took the .dmg? Clear only the quarantine flag with \`xattr -dr com.apple.quarantine /Applications/AI-Cockpit.app\` — not \`xattr -cr\`, which also wipes the extended attributes carrying each managed assembly's signature and leaves the app unsigned."
          } > nightly-notes.md

      # Delete and recreate rather than update: an existing release keeps its old assets and — the part that
      # bites — its old tag, so 'nightly' kept pointing at the commit before last while the page claimed the new
      # one. The tag is what the next run's "did anything change?" check reads, so a tag that never moves means a
      # nightly that rebuilds identical bytes every night.
      - name: Publish the rolling nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

          # Both paths spelled out: artifacts/* matches the velopack directory rather than descending into it, and
          # gh would refuse a directory — leaving the release without the feed index the updater reads.
          gh release create nightly \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "Nightly ${{ steps.version.outputs.version }} (${{ steps.version.outputs.sha }})" \
            --notes-file nightly-notes.md \
            artifacts/* artifacts-velopack/*

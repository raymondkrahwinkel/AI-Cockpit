name: CI

# Every push and every pull request: the app builds warning-free and the tests pass. The repo had no CI at all,
# so "0 warnings, tests green" was something a person had to remember to check on their own machine.
on:
  push:
    branches: [main]
  pull_request:

# A superseded run holds a runner to the end for a result nobody reads (AC-1243: 14 of 75 pull-request
# runs). Never on main -- that run is the full-suite net behind the per-PR scoping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips downstream jobs via job-level `if:`, never by filtering the `on:` trigger: GitHub counts a job
  # skipped by `if:` as a passing required check, but a filtered trigger means the workflow never runs at
  # all -- and a required check would then hang forever waiting on a run that never starts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      plugins_dev: ${{ steps.filter.outputs.plugins_dev }}
      other: ${{ steps.filter.outputs.other }}
      run_core_tests: ${{ steps.filter.outputs.run_core_tests }}
      run_infrastructure_tests: ${{ steps.filter.outputs.run_infrastructure_tests }}
      run_view_tests: ${{ steps.filter.outputs.run_view_tests }}
      plugins: ${{ steps.filter.outputs.plugins }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Diffing against BASE below needs real history, not the default shallow clone.
          fetch-depth: 0

      - name: Categorize changed files
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push reports an all-zero "before"; there is no range to diff, so run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            bash scripts/classify-changes.sh --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/classify-changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"

      - name: Guard's own tests
        run: bash scripts/classify-changes.test.sh

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.plugins_dev == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No packages.lock.json in this repo, so the cache key hashes every csproj instead -- it invalidates
      # whenever a dependency version changes, same effect as a lock file for cache purposes.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Cockpit.slnx

      # -warnaserror is the point: the project's standing rule is a zero-warning build, and a rule nothing
      # enforces is a suggestion. Unused usings fail here too (IDE0005, see Directory.Build.props).
      - name: Build
        run: dotnet build Cockpit.slnx --configuration Release --no-restore -warnaserror

      # --blame-hang catches what the banned-symbols list can't: AC-577 was a hang with no failing test and
      # no summary, burning toward GitHub's six-hour job limit. Dump is off because the sequence file
      # already names the test that was running -- the whole ask.
      #
      # The `if:` here is scripts/classify-changes.sh's mechanically-derived verdict on whether this diff's
      # touched projects reach Cockpit.Core.Tests's own <ProjectReference> closure (AC-863) -- not a
      # hand-kept guess about which suite "should" cover which change.
      - name: Test
        if: needs.changes.outputs.run_core_tests == 'true'
        run: dotnet test tests/Cockpit.Core.Tests/Cockpit.Core.Tests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 1m --blame-hang-dump-type none

      # Named explicitly, like every other suite here: the solution build above compiles this project but runs
      # nothing in it, and a test project CI never executes is worse than none — it reads as covered.
      - name: Infrastructure tests
        if: needs.changes.outputs.run_infrastructure_tests == 'true'
        run: dotnet test tests/Cockpit.Infrastructure.Tests/Cockpit.Infrastructure.Tests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 1m --blame-hang-dump-type none

      # The view tests run in their own process: Avalonia's dispatcher is global and belongs to one thread, so a
      # headless platform in the same process as everything else kills the test host rather than failing a test.
      - name: View tests
        if: needs.changes.outputs.run_view_tests == 'true'
        run: dotnet test tests/Cockpit.App.ViewTests/Cockpit.App.ViewTests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 1m --blame-hang-dump-type none

      # The release notes are generated by a shell script, so no .NET suite covers it — and it is the one piece
      # of this repo whose output goes straight to people downloading a build. It shipped a nightly whose body
      # was mostly bare pull request links; that is the shape this guards against.
      - name: Release-notes generator tests
        run: bash scripts/nightly-notes.test.sh

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

  # The plugins live outside the solution (plugins-dev/), so the solution build above never sees them — and a
  # contract change in Cockpit.Plugins.Abstractions breaks them silently until someone rebuilds one by hand.
  plugins:
    needs: changes
    if: needs.changes.outputs.plugins != '[]'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.changes.outputs.plugins) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'plugins-dev/**/*.csproj'

      - name: Select project
        id: project
        run: |
          project="plugins-dev/${{ matrix.plugin }}/${{ matrix.plugin }}.csproj"
          test_project="plugins-dev/${{ matrix.plugin }}.Tests/${{ matrix.plugin }}.Tests.csproj"
          if [ -f "$test_project" ]; then
            project="$test_project"
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "path=$project" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build "${{ steps.project.outputs.path }}" --configuration Release -warnaserror

      - name: Test
        if: steps.project.outputs.has_tests == 'true'
        run: dotnet test "${{ steps.project.outputs.path }}" --configuration Release --no-build --logger "console;verbosity=minimal" --blame-hang --blame-hang-timeout 1m --blame-hang-dump-type none

      - name: Upload test results
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-test-results-${{ matrix.plugin }}
          path: TestResults
          if-no-files-found: warn

  # A plugin can pass every test here and still be unpublishable: the store only offers an update when the
  # version string moved (AC-276, 2026-07-30 shipped a fix nobody could get). Catch it before the change
  # merges and the number is already spent.
  plugin-versions:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.plugins_dev == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The guard reads plugin.json at two commits, so the shallow default clone is not enough.
          fetch-depth: 0

      # Runs before the real checks below: a red step here means a guard broke, not that it found something.
      - name: Guards' own tests
        run: |
          bash scripts/check-plugin-versions.test.sh
          bash scripts/check-plugin-abstractions-version.test.sh

      - name: Every changed plugin carries a newer version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # AC-983: re-fetch main's tip instead of trusting the base.sha frozen at PR-open, so the check
            # compares against what main carries right now, not what it carried when the PR was opened.
            git fetch origin "$BASE_REF"
            BASE="$(git rev-parse "origin/$BASE_REF")"
          else
            BASE="$BASE_SHA"
          fi
          # A branch's first push reports an all-zero "before"; there is no range to compare and nothing to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          bash scripts/check-plugin-versions.sh "$BASE" HEAD

      - name: Every plugin's abstractionsVersion matches the host contract
        run: bash scripts/check-plugin-abstractions-version.sh

  # AC-319/AC-593 swept /// down to interface members, in ~15,700 lines across seven rounds. A rule nothing
  # enforces drifts back to where it started -- this is the enforcement.
  xmldoc-scope:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: /// stays on interface declarations and their members only
        run: python3 scripts/check-xmldoc-scope.py

      - name: Guard's own tests
        run: python3 scripts/check-xmldoc-scope.test.py

  # AC-1013 §4: five tickets in a row landed new comment-length debt through review despite an explicit
  # agent-prompt instruction not to. Existing debt is grandfathered via scripts/comment-length-baseline.txt.
  comment-length:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Comment blocks stay within the CodeQuality.md §5 limit
        run: python3 scripts/check-comment-length.py

      - name: Guard's own tests
        run: python3 scripts/check-comment-length.test.py

  # AC-1244: five tests were copied to cover a second case, renamed, and never given the arrange the new name
  # promises. All five were found by looking for byte-equal test bodies within one file -- so that is the check.
  duplicate-test-bodies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: No two tests in one file share a body
        run: python3 scripts/check-duplicate-test-bodies.py

      - name: Guard's own tests
        run: python3 scripts/check-duplicate-test-bodies.test.py

  # AC-998: one selector of this shape held 95% of the live heap. The form is used 35 more times legitimately,
  # so what is guarded is the right-hand side, not the form.
  descendant-selector-scope:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: No framework base type on the right of a descendant selector
        run: python3 scripts/check-descendant-selector-scope.py

      - name: Guard's own tests
        run: python3 scripts/check-descendant-selector-scope.test.py

name: CI

# Every push and every pull request: the app builds warning-free and the tests pass. The repo had no CI at all,
# so "0 warnings, tests green" was something a person had to remember to check on their own machine.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Skips downstream jobs via job-level `if:`, never by filtering the `on:` trigger: GitHub counts a job
  # skipped by `if:` as a passing required check, but a filtered trigger means the workflow never runs at
  # all -- and a required check would then hang forever waiting on a run that never starts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      plugins_dev: ${{ steps.filter.outputs.plugins_dev }}
      other: ${{ steps.filter.outputs.other }}
      run_core_tests: ${{ steps.filter.outputs.run_core_tests }}
      run_infrastructure_tests: ${{ steps.filter.outputs.run_infrastructure_tests }}
      run_view_tests: ${{ steps.filter.outputs.run_view_tests }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Diffing against BASE below needs real history, not the default shallow clone.
          fetch-depth: 0

      - name: Categorize changed files
        id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push reports an all-zero "before"; there is no range to diff, so run everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
            echo "plugins_dev=true" >> "$GITHUB_OUTPUT"
            echo "other=true" >> "$GITHUB_OUTPUT"
            echo "run_core_tests=true" >> "$GITHUB_OUTPUT"
            echo "run_infrastructure_tests=true" >> "$GITHUB_OUTPUT"
            echo "run_view_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/classify-changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"

      - name: Guard's own tests
        run: bash scripts/classify-changes.test.sh

  build:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.plugins_dev == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No packages.lock.json in this repo, so the cache key hashes every csproj instead -- it invalidates
      # whenever a dependency version changes, same effect as a lock file for cache purposes.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Cockpit.slnx

      # -warnaserror is the point: the project's standing rule is a zero-warning build, and a rule nothing
      # enforces is a suggestion. Unused usings fail here too (IDE0005, see Directory.Build.props).
      - name: Build
        run: dotnet build Cockpit.slnx --configuration Release --no-restore -warnaserror

      # --blame-hang catches what the banned-symbols list can't: AC-577 was a hang with no failing test and
      # no summary, burning toward GitHub's six-hour job limit. Dump is off because the sequence file
      # already names the test that was running -- the whole ask.
      #
      # The `if:` here is scripts/classify-changes.sh's mechanically-derived verdict on whether this diff's
      # touched projects reach Cockpit.Core.Tests's own <ProjectReference> closure (AC-863) -- not a
      # hand-kept guess about which suite "should" cover which change.
      - name: Test
        if: needs.changes.outputs.run_core_tests == 'true'
        run: dotnet test tests/Cockpit.Core.Tests/Cockpit.Core.Tests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      # Named explicitly, like every other suite here: the solution build above compiles this project but runs
      # nothing in it, and a test project CI never executes is worse than none — it reads as covered.
      - name: Infrastructure tests
        if: needs.changes.outputs.run_infrastructure_tests == 'true'
        run: dotnet test tests/Cockpit.Infrastructure.Tests/Cockpit.Infrastructure.Tests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      # The view tests run in their own process: Avalonia's dispatcher is global and belongs to one thread, so a
      # headless platform in the same process as everything else kills the test host rather than failing a test.
      - name: View tests
        if: needs.changes.outputs.run_view_tests == 'true'
        run: dotnet test tests/Cockpit.App.ViewTests/Cockpit.App.ViewTests.csproj --configuration Release --no-build --verbosity minimal --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type none

      # The release notes are generated by a shell script, so no .NET suite covers it — and it is the one piece
      # of this repo whose output goes straight to people downloading a build. It shipped a nightly whose body
      # was mostly bare pull request links; that is the shape this guards against.
      - name: Release-notes generator tests
        run: bash scripts/nightly-notes.test.sh

  # The plugins live outside the solution (plugins-dev/), so the solution build above never sees them — and a
  # contract change in Cockpit.Plugins.Abstractions breaks them silently until someone rebuilds one by hand.
  plugins:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.plugins_dev == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'plugins-dev/**/*.csproj'

      - name: Build every plugin against the current SDK
        run: |
          for plugin in plugins-dev/Cockpit.Plugin.*/; do
            case "$plugin" in *.Tests/) continue;; esac
            echo "::group::$plugin"
            dotnet build "$plugin" --configuration Release -warnaserror
            echo "::endgroup::"
          done

      - name: Test the plugins that have tests
        run: |
          for tests in plugins-dev/Cockpit.Plugin.*.Tests/; do
            echo "::group::$tests"
            dotnet test "$tests" --configuration Release --verbosity minimal
            echo "::endgroup::"
          done

  # A plugin can pass every test here and still be unpublishable: the store only offers an update when the
  # version string moved (AC-276, 2026-07-30 shipped a fix nobody could get). Catch it before the change
  # merges and the number is already spent.
  plugin-versions:
    needs: changes
    if: needs.changes.outputs.src == 'true' || needs.changes.outputs.plugins_dev == 'true' || needs.changes.outputs.other == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The guard reads plugin.json at two commits, so the shallow default clone is not enough.
          fetch-depth: 0

      - name: Every changed plugin carries a newer version
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A branch's first push reports an all-zero "before"; there is no range to compare and nothing to check.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          bash scripts/check-plugin-versions.sh "$BASE" HEAD

      - name: Guard's own tests
        run: bash scripts/check-plugin-versions.test.sh

  # AC-319/AC-593 swept /// down to interface members, in ~15,700 lines across seven rounds. A rule nothing
  # enforces drifts back to where it started -- this is the enforcement.
  xmldoc-scope:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: /// stays on interface declarations and their members only
        run: python3 scripts/check-xmldoc-scope.py

      - name: Guard's own tests
        run: python3 scripts/check-xmldoc-scope.test.py

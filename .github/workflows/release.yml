name: Release

# A tag is the release (#71): push v1.2.3 and this builds that version for every platform and publishes it as a
# GitHub release. GitHub is the source of truth for "what is the latest version" — the in-app updater will read
# these releases, so what is published here is what an operator gets.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # 'v*' is as narrow as a tag filter gets, and it still lets through far more than a release should be:
  # v0.8.0-rc.1, v1.2, v1.2.3.4 and version-1.2.3 all match it. Every one of those would have built a full
  # release with prerelease: false — taking over GitHub's "latest release" — and the finalize job would then
  # have rolled [Unreleased] away under it, leaving the real release that followed with empty notes. So the
  # tag is checked here, in its own job that everything else needs, before anything reads or writes the
  # changelog. A workflow job rather than a line in a script: a script is something a later step can forget
  # to call.
  gate:
    runs-on: ubuntu-latest
    steps:
      # GITHUB_REF_NAME rather than the templating expression for the same value: a tag name is
      # attacker-supplied text, and an expression is substituted into the script before bash parses it, so a
      # tag carrying a quote would be run as shell rather than compared as a string.
      - name: Reject a tag that is not a plain vMAJOR.MINOR.PATCH
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$GITHUB_REF_NAME' is not a release tag. A release is tagged vMAJOR.MINOR.PATCH — for example v1.2.3 — with no suffix and no fourth part. Nothing was built and the changelog was not touched; delete the tag and push a plain version tag instead."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is a release tag."

  # The release notes are the changelog, not the commit list: pull the [Unreleased] section out before
  # anything is built, so every platform's publish attaches the same curated body. Read-only here — the
  # changelog is only *rolled* into a version (the finalize job below) once the release has gone out.
  changelog:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract the release notes from CHANGELOG.md
        shell: bash
        run: |
          bash scripts/changelog.sh notes > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Release notes taken from the changelog's [Unreleased] section:"
            cat release-notes.md
          else
            echo "No [Unreleased] entries — the release will fall back to the auto-generated commit list."
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 2

  publish:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The tag is the version. Strip the leading v so 'v1.2.3' becomes the assembly version 1.2.3, which is
      # what the About dialog and the plugin host-version check read.
      - name: Resolve the version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Self-contained: the operator should not have to install a .NET runtime to run a desktop app. A directory
      # publish on every platform now — the updater replaces an application *folder*, so it needs the files as
      # files, and a self-extracting single exe defeats that (AC-384). Not trimmed either way: trimming is what
      # breaks Avalonia's reflection-driven XAML loading.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cockpit.App/Cockpit.App.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:Version=${{ steps.version.outputs.version }} \
            --output publish/${{ matrix.rid }}

      # One artifact per platform, and it is the thing you run: a Setup.exe on Windows (built further down, from
      # this directory publish, by vpk), a .app on macOS, an AppImage on Linux. The Linux tarball rides along as
      # well, because unpacking a directory on a server is a real use.
      - name: Package
        shell: bash
        run: |
          mkdir -p artifacts
          version="${{ steps.version.outputs.version }}"
          case "${{ matrix.rid }}" in
            osx-arm64)
              scripts/package-macos.sh arm64 "$version"

              # The .dmg for a person (open, drag onto Applications), the zipped bundle for automation.
              mv artifacts/macos/*.dmg "artifacts/ai-cockpit-$version-macos-arm64.dmg"

              # ditto, not zip: it keeps the bundle's symlinks and permissions, and a .app that lost its executable
              # bit is a .app that will not open.
              ditto -c -k --sequesterRsrc --keepParent \
                artifacts/macos/AI-Cockpit.app "artifacts/ai-cockpit-$version-macos-arm64.app.zip"
              rm -rf artifacts/macos
              ;;
            linux-x64)
              tar -czf "artifacts/ai-cockpit-$version-linux-x64.tar.gz" -C publish/linux-x64 .
              ;;
          esac

      # The AppImage rides alongside the tarball, as it does in the nightly — a release that offered less than a
      # nightly would be a strange thing to ask anyone to upgrade to.
      - name: AppImage
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          scripts/package-appimage.sh publish/linux-x64 "${{ steps.version.outputs.version }}"
          mv artifacts/appimage/*.AppImage \
            "artifacts/ai-cockpit-${{ steps.version.outputs.version }}-x86_64.AppImage"
          rm -rf artifacts/appimage

      # The Velopack feed: what the in-app updater actually reads (AC-384). vpk turns the publish directory into a
      # Setup, a Portable build and the *-full.nupkg the updater downloads, plus the two index files it looks the
      # release up in. Pinned to the version the Velopack package in the app is on — the tool writes the feed that
      # library reads, so they are a matched pair, not two independent dependencies.
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0

      # macOS wants an .icns and the repository has none — only the .ico Windows uses and the .png everything else
      # does. Built here from the PNG rather than committed, so there is one source of truth for the icon.
      - name: Build the macOS icon
        if: matrix.rid == 'osx-arm64'
        shell: bash
        run: |
          iconset=AppIcon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size src/Cockpit.App/Assets/AppIcon.png --out "$iconset/icon_${size}x${size}.png"
            sips -z $((size * 2)) $((size * 2)) src/Cockpit.App/Assets/AppIcon.png --out "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o AppIcon.icns

      # The channel carries the platform as well as the stream, so one feed can never offer a macOS package to a
      # Windows install: an updater asks for releases.win-stable.json and finds only Windows builds in it.
      #
      # Its own output directory, because scripts/pack-sdk.sh writes the plugin SDK into artifacts/ as well. Mixed
      # together there would be no telling which files the updater is meant to read.
      - name: Pack the Velopack release
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RID: ${{ matrix.rid }}
        run: |
          case "$RID" in
            win-x64)   platform=win;   main_exe=Cockpit.App.exe; icon=src/Cockpit.App/Assets/AppIcon.ico ;;
            osx-arm64) platform=osx;   main_exe=Cockpit.App;     icon=AppIcon.icns ;;
            linux-x64) platform=linux; main_exe=Cockpit.App;     icon=src/Cockpit.App/Assets/AppIcon.png ;;
          esac

          # --categories exists on the Linux packer only; it replaces a hand-written .desktop entry.
          EXTRA=()
          if [ "$platform" = "linux" ]; then
            EXTRA+=(--categories "Development;System")
          fi

          # ${EXTRA[@]+"${EXTRA[@]}"} rather than "${EXTRA[@]}": the macOS runners are on bash 3.2, which treats
          # expanding an empty array as an unbound variable under set -u and kills the step.
          #
          # --noDefaultExclude: vpk pack silently drops createdump from every package it builds otherwise (its
          # built-in exclude list, undocumented outside `vpk pack -H`) — the AppImage and nupkg it produces here
          # are what auto-update actually installs, so that silent drop is what left every packaged build unable
          # to write a heap dump (AC-989). The --exclude default (.*\.pdb) keeps stripping debug symbols either
          # way, since that is a separate, explicit option.
          vpk pack ${EXTRA[@]+"${EXTRA[@]}"} \
            --noDefaultExclude \
            --packId AI-Cockpit \
            --packTitle "Wispslate Cockpit" \
            --packAuthors "Raymond Krahwinkel" \
            --packVersion "$VERSION" \
            --packDir "publish/$RID" \
            --mainExe "$main_exe" \
            --icon "$icon" \
            --channel "$platform-stable" \
            --outputDir artifacts-velopack

          # Guards the fix above: a package missing createdump is otherwise indistinguishable from a healthy one
          # until someone tries to collect a dump and gets a silent "Complete" (AC-989). Windows has no
          # createdump (dotnet-dump uses MiniDumpWriteDump there), so this only runs for linux/osx. The portable
          # artifact is checked rather than the full nupkg: on Linux the nupkg embeds the whole AppImage as one
          # opaque file, so its own extractor is the only way in; on macOS the portable zip is a flat listing.
          case "$platform" in
            linux)
              appimage="artifacts-velopack/AI-Cockpit-linux-stable.AppImage"
              chmod +x "$appimage"
              rm -rf squashfs-root
              "$appimage" --appimage-extract usr/bin/createdump >/dev/null
              found=$([ -x squashfs-root/usr/bin/createdump ] && echo 1 || echo 0)
              rm -rf squashfs-root
              ;;
            osx)
              found=$(unzip -l "artifacts-velopack/AI-Cockpit-osx-stable-Portable.zip" | grep -c "createdump" || true)
              ;;
          esac
          if [ "$platform" != "win" ] && [ "$found" = "0" ]; then
              echo "createdump is missing from the $platform package — .NET crash dumps would silently fail (AC-989)." >&2
              exit 1
          fi

      # The plugin SDK rides along with the host it is the contract for: the release that carries a contribution
      # point is the release an out-of-repo plugin author has something to pin to. Packed on the Linux leg only —
      # a library package is platform-independent, so building it three times would just be three identical
      # files racing for the same asset name. Its version is the SDK's own (the .csproj's <Version>, semver on
      # the contract's members), deliberately not the tag: host and contract move on separate axes. Not pushed
      # to nuget.org — see the header of scripts/pack-sdk.sh for why the feed waits.
      - name: Plugin SDK
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: scripts/pack-sdk.sh artifacts

      # The curated notes built once in the changelog job. body_path is the changelog's [Unreleased]
      # section; generate_release_notes then appends the full commit list beneath it, so the release
      # page reads as "what changed, in prose" followed by "every commit, in full". Each platform's
      # job sets the same body — the action replaces rather than accumulates, so it stays idempotent.
      - uses: actions/download-artifact@v8
        with:
          name: release-notes

      # Every platform ships something unsigned, and each one refuses it differently — Gatekeeper quarantines,
      # SmartScreen warns, an AppImage arrives without its executable bit. None of that is a fault the downloader
      # can diagnose from the message they get, and the release page is where they actually are, so it is answered
      # here rather than only in the README (AC-389).
      #
      # Written with a quoted heredoc: the body contains backticks and quotes, and nothing in it is meant to be
      # expanded by the shell.
      - name: Append what each platform needs on first run
        shell: bash
        run: |
          cat >> release-notes.md <<'NOTES'

          ---

          ### Installing this

          Nothing here is code-signed. That is a deliberate, documented state, not a warning about this particular
          build — but each platform says so in its own way, and none of them explain what to do next.

          **Windows.** `AI-Cockpit-win-stable-Setup.exe` installs the cockpit and is the one that can update itself
          from now on. SmartScreen will say the publisher is unknown: choose **More info → Run anyway**. If you would
          rather not install anything, `AI-Cockpit-win-stable-Portable.zip` is the same build as a folder you unpack
          and run — but a portable copy cannot update itself, and it will tell you so instead of pretending.

          > **If you installed an earlier version with `ai-cockpit-…-win-x64-setup.exe`, read this once.** That
          > installer put the cockpit in `Program Files`; the new one installs per-user, and it does not adopt the old
          > location. The two are separate installations, so run the new Setup once and then remove the old entry from
          > **Settings → Apps** — otherwise you keep a copy that will never update and can still be launched by
          > accident. Nothing of yours moves: settings, plugins, projects and logs live in `%APPDATA%\Cockpit`,
          > beside neither installation, and both find them there.

          **macOS.** Install with one command rather than the `.dmg`:

          ```
          curl -fsSL https://raw.githubusercontent.com/raymondkrahwinkel/AI-Cockpit/main/scripts/install-macos.sh | bash
          ```

          The download is ad-hoc signed, not notarized, so a copy your *browser* fetched is quarantined and
          Gatekeeper reports that it "is damaged and can't be opened". It is not damaged — the flag is written by
          the downloader, and `curl` does not write one, so a copy installed by that command opens normally.
          Already took the `.dmg`? Clear only the quarantine flag with
          `xattr -dr com.apple.quarantine /Applications/AI-Cockpit.app` — not `xattr -cr`, which also wipes the
          extended attributes carrying each managed assembly's signature and leaves the app unsigned.

          **Linux.** The AppImage arrives without its executable bit — `chmod +x AI-Cockpit-*.AppImage`, then run it.
          It mounts itself with FUSE; on a distribution that ships only fuse3, either install `libfuse2` or run it
          with `--appimage-extract-and-run`.

          ### Everything else on this page

          `RELEASES-*`, `releases.*.json` and `*-full.nupkg` are the Velopack update feed, not download options —
          they are what the in-app updater reads to find and verify the next version. They have to be on this
          release for auto-update to work, but nobody downloads them by hand; pick one of the files above instead.
          NOTES

      - uses: softprops/action-gh-release@v2
        with:
          # Both directories by name: the glob does not descend, so artifacts/* alone would attach the Velopack
          # folder as nothing at all — and the feed index inside it is the one file the updater cannot do without.
          files: |
            artifacts/*
            artifacts-velopack/*
          body_path: release-notes.md
          draft: false
          prerelease: false
          # The curated changelog IS the release note; do not let GitHub append its raw commit list
          # underneath it — those subjects are internal (ticket-only) and read as noise to a downloader.
          generate_release_notes: false

  # Only now that every platform has published: move the [Unreleased] entries under the version that
  # just shipped and open a fresh empty section, committed back to the default branch. After the
  # release, not before — a build that failed should never leave the changelog claiming it shipped.
  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}

      - name: Resolve the version from the tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Roll [Unreleased] into this version and commit it back
        shell: bash
        run: |
          bash scripts/changelog.sh roll "${{ steps.version.outputs.version }}" "$(date -u +%Y-%m-%d)"
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "- changed: rolled the changelog's [Unreleased] entries under ${GITHUB_REF_NAME}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

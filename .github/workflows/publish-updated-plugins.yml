name: Publish updated plugins

# Ships whatever main carries that the store does not have yet, so that "this plugin needs publishing" stops
# being something a person has to remember. On 2026-07-30 twelve of twenty-four plugins held merged code no
# published zip contained — including a session-status fix that reached nobody for a week — while the store
# index reported every plugin up to date, because by its own measure it was.
#
# The criterion is deliberately "the manifest version is not in the store index" rather than "a version
# changed in this push". A range is only right if every run fires and succeeds; a missing-versions comparison
# is idempotent and self-healing — a run that never fired, or failed halfway, is simply picked up by the next
# one. Nothing is republished, because a version already in the index is not missing.
#
# It runs after the Nightly rather than on push, and that ordering is the point: a plugin that needs a host
# API only lands in a host build later, and publish-plugin.yml refuses (rightly) to publish a plugin no
# published host can run. Waiting for the nightly means the host is out by the time the plugin goes.
#
# The version bump itself is guarded elsewhere — ci.yml's plugin-versions job fails a pull request whose
# plugin code moved without its number. That guard and this workflow are two halves of one thing: one makes
# sure there is something to publish, the other makes sure it gets published.

on:
  workflow_run:
    workflows: [Nightly]
    types: [completed]
  workflow_dispatch:

env:
  STORE_REPO: raymondkrahwinkel/AI-Cockpit-Plugins

permissions:
  contents: read
  actions: read

jobs:
  discover:
    # A nightly that failed proves nothing about which host is out there, and the gate downstream reads exactly
    # that. Manual runs carry no conclusion to wait for.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      plugins: ${{ steps.missing.outputs.plugins }}

    steps:
      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Check out the store repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.STORE_PUBLISH_TOKEN }}
          path: store

      - name: Which plugin versions are missing from the store?
        id: missing
        shell: bash
        run: |
          set -euo pipefail
          # Newline-separated text, not an array: an empty array has to be special-cased at every expansion,
          # and getting that wrong here does not fail — it emits [""], which the matrix runs as a plugin named
          # empty string.
          missing=''
          for manifest in plugins-dev/Cockpit.Plugin.*/plugin.json; do
            id="$(jq -r '.id' "$manifest")"
            version="$(jq -r '.version' "$manifest")"
            present="$(jq -r --arg id "$id" --arg v "$version" \
              '.plugins[]? | select(.id==$id) | .versions[]?.version | select(.==$v)' store/index.json | head -1)"
            if [ "$present" = "$version" ]; then
              echo "up to date: $id $version"
            else
              echo "MISSING:    $id $version"
              missing="${missing}${id}"$'\n'
            fi
          done

          # Compact, so the matrix gets ["a","b"] — and a literal [] when there is nothing to do, which is what
          # the job below tests to skip itself.
          if [ -z "$missing" ]; then
            json='[]'
          else
            json="$(printf '%s' "$missing" | jq -R . | jq -sc .)"
          fi
          echo "Publishing: $json"
          printf 'plugins=%s\n' "$json" >> "$GITHUB_OUTPUT"

  prepare:
    needs: discover
    if: needs.discover.outputs.plugins != '[]' && needs.discover.outputs.plugins != ''

    strategy:
      # A failed host or package gate must not cancel the other plugins.
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.discover.outputs.plugins) }}

    uses: ./.github/workflows/publish-plugin.yml
    with:
      plugin: ${{ matrix.plugin }}
      prepare_only: true
    secrets: inherit

  publish:
    needs: [discover, prepare]
    if: ${{ !cancelled() && needs.discover.result == 'success' && needs.prepare.result != 'skipped' }}
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-store-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.STORE_PUBLISH_TOKEN }}
          path: store

      - name: Are there verified packages from this run?
        id: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("prepared-plugin-"))] | length' | awk '{n+=$1} END {print n+0}')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.artifacts.outputs.count != '0'
        with:
          pattern: prepared-plugin-*
          path: prepared

      - name: Reverify and collect the successful plugins
        id: collect
        if: steps.artifacts.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          count=0
          failed=0
          for candidate in prepared/prepared-plugin-*; do
            metadata="$candidate/publish.json"
            PLUGIN="$(jq -r '.plugin' "$metadata")"
            MANIFEST="$(jq -r '.manifest' "$metadata")"
            DIR="$(dirname "$MANIFEST")"
            VERSION="$(jq -r '.version' "$MANIFEST")"
            MIN_HOST="$(jq -r '.minHostVersion // ""' "$MANIFEST")"
            REL="$(jq -r '.rel' "$metadata")"
            SHA="$(jq -r '.sha' "$metadata")"
            PACKAGES="$(jq -r '.packages' "$metadata")"
            NOTES="$(jq -r '.notes' "$metadata")"
            SUBPROCESS="$(jq -r '.subprocess' "$metadata")"
            export PLUGIN MANIFEST DIR VERSION MIN_HOST REL SHA PACKAGES NOTES SUBPROCESS

            if jq -e --arg id "$PLUGIN" --arg v "$VERSION" \
              '.plugins[]? | select(.id==$id) | .versions[]? | select(.version==$v)' store/index.json >/dev/null; then
              echo "::notice::$PLUGIN $VERSION is already published; keeping its immutable packages."
              continue
            fi

            # An invalid candidate must not leave its index entry in the batch.
            cp store/index.json "$candidate/index.json"
            if STORE="$candidate" bash scripts/update-and-verify-plugin.sh; then
              cp "$candidate/index.json" store/index.json
              mkdir -p "store/$PLUGIN"
              cp "$candidate/$PLUGIN/"*.zip "store/$PLUGIN/"
              printf '%s %s\n' "$PLUGIN" "$VERSION" >> "$RUNNER_TEMP/published-plugins.txt"
              count=$((count + 1))
            else
              echo "::error::Rejecting $PLUGIN $VERSION; continuing with the other plugins."
              failed=$((failed + 1))
            fi
          done
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Publish the batch in one store PR
        if: steps.collect.outputs.count != '' && steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.STORE_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          branch="publish/plugins-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          {
            printf 'Verified plugin batch from https://github.com/%s/actions/runs/%s\n\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            cat "$RUNNER_TEMP/published-plugins.txt"
          } > "$RUNNER_TEMP/pr-body.md"
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- '*.zip' index.json
          git commit -m "Publish verified plugin batch $GITHUB_RUN_ID"
          git push origin "$branch"
          gh pr create --repo "$STORE_REPO" --head "$branch" \
            --title "Publish verified plugin batch $GITHUB_RUN_ID" --body-file "$RUNNER_TEMP/pr-body.md"
          number="$(gh pr list --repo "$STORE_REPO" --head "$branch" --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            echo "::error::No open PR found for $branch."
            exit 1
          fi
          gh pr merge "$number" --repo "$STORE_REPO" --squash --delete-branch

      - name: Report rejected candidates
        if: steps.collect.outputs.failed != '' && steps.collect.outputs.failed != '0'
        run: exit 1

name: Publish plugin to store

# Manual publishing and batch preparation share the same host and package gates.

on:
  workflow_call:
    inputs:
      plugin:
        description: The plugin id to publish
        required: true
        # A called workflow cannot take a choice; the dispatch form below keeps the picker for humans.
        type: string
      notes:
        description: Release notes for this version
        required: false
        type: string
      dry_run:
        description: Build, hash and verify, but open no PR
        required: false
        type: boolean
        default: false
      auto_merge:
        description: Merge the store PR once the verification below passes
        required: false
        type: boolean
        default: false
    secrets:
      STORE_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin id to publish (its plugin.json version is what gets published)
        required: true
        type: choice
        options:
          - autopilot
          - browser
          - claude-provider
          - cli-agent-provider
          - clock
          - depot
          - diagram
          - discord
          - docker
          - example-companion-tool
          - example-workspace
          - gemini-provider
          - git-status
          - github-actions
          - github-issues
          - github-pull-requests
          - grok-provider
          - kimi-provider
          - kind
          - kubernetes
          - local-ci
          - local-files
          - opencode-provider
          - openrouter-provider
          - productivity
          - prompt-library
          - proxmox
          - remote-files
          - schedules
          - session-review
          - slack
          - system-monitor
          - transcript-search
          - usage-trend
          - workflows
          - youtrack
      notes:
        description: Release notes for this version (optional; shown in the store's version history)
        required: false
        type: string
      dry_run:
        description: Build, hash and show the index diff, but do not open a PR
        required: false
        type: boolean
        default: false
      auto_merge:
        description: Merge the store PR once verification passes (leave off to review it yourself)
        required: false
        type: boolean
        default: false

# The store needs its own write token because GITHUB_TOKEN only reaches this repository.
env:
  STORE_REPO: raymondkrahwinkel/AI-Cockpit-Plugins

permissions:
  contents: read

jobs:
  runtime-identifiers:
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.info.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: info
        env:
          PLUGIN: ${{ inputs.plugin }}
        shell: bash
        run: bash scripts/plugin-publish.sh info "$PLUGIN"

  package-windows:
    needs: runtime-identifiers
    if: needs.runtime-identifiers.outputs.windows != ''
    runs-on: windows-latest
    outputs:
      count: ${{ steps.prepare.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - id: prepare
        env:
          PLUGINS: ${{ format('[{0}]', toJSON(inputs.plugin)) }}
        shell: bash
        run: bash scripts/plugin-publish.sh batch windows
      - uses: actions/upload-artifact@v7
        if: steps.prepare.outputs.count != '0'
        with:
          name: subprocess-windows-${{ inputs.plugin }}
          path: subprocess/
          if-no-files-found: error
          overwrite: true
      - if: steps.prepare.outputs.failed != '0'
        run: exit 1

  publish:
    needs: [runtime-identifiers, package-windows]
    if: ${{ !cancelled() && needs.runtime-identifiers.result == 'success' && needs.package-windows.result != 'failure' }}
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-store-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.STORE_PUBLISH_TOKEN }}
          path: store
      - uses: actions/download-artifact@v8
        if: needs.package-windows.outputs.count != '' && needs.package-windows.outputs.count != '0'
        with:
          name: subprocess-windows-${{ inputs.plugin }}
          path: subprocess
      - id: prepare
        env:
          PLUGINS: ${{ format('[{0}]', toJSON(inputs.plugin)) }}
          NOTES: ${{ inputs.notes }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/plugin-publish.sh batch linux
      - id: collect
        if: steps.prepare.outputs.count != '0'
        shell: bash
        run: |
          bash scripts/collect-plugin-packages.sh
          git -C store --no-pager diff -- index.json

      # The zip and index diff remain reviewable before the optional merge.
      - name: Open a PR against the store repo
        id: pr
        if: steps.collect.outputs.count == '1' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.STORE_PUBLISH_TOKEN }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.prepare.outputs.version }}
          MIN_HOST: ${{ steps.prepare.outputs.min_host }}
          SHA: ${{ steps.prepare.outputs.sha }}
        shell: bash
        run: |
          branch="publish/$PLUGIN-$VERSION"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated publish from [AI-Cockpit](https://github.com/${GITHUB_REPOSITORY}) run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          - Plugin: \`$PLUGIN\`
          - Version: \`$VERSION\`
          - minHostVersion: \`$MIN_HOST\`
          - sha256: \`$SHA\`

          Review the added zip and the \`index.json\` diff, then merge to publish.
          EOF

          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # The one zip, or one per RID (AC-1740): both match $PLUGIN-$VERSION*.zip.
          git add "$PLUGIN/$PLUGIN-$VERSION"*.zip index.json
          git commit -m "Publish $PLUGIN $VERSION"
          # A throwaway publish branch; force so a re-run after a failed attempt overwrites cleanly.
          git push --force origin "$branch"

          gh pr create \
            --repo "$STORE_REPO" \
            --head "$branch" \
            --title "Publish $PLUGIN $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            || echo "::warning::Branch pushed; a PR may already exist for $branch."

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # The store has no required checks, so verification above is the gate before a direct merge.
      - name: Merge the store PR
        if: steps.collect.outputs.count == '1' && inputs.dry_run != true && inputs.auto_merge == true
        env:
          GH_TOKEN: ${{ secrets.STORE_PUBLISH_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$STORE_REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            echo "::error::No open PR found for branch $BRANCH; refusing to guess which one to merge."
            exit 1
          fi
          gh pr merge "$number" --repo "$STORE_REPO" --squash --delete-branch
          echo "::notice::Published $PLUGIN $VERSION — store PR #$number merged."

      - name: Dry-run summary
        if: steps.collect.outputs.count == '1' && inputs.dry_run == true
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.prepare.outputs.version }}
          SHA: ${{ steps.prepare.outputs.sha }}
        shell: bash
        run: echo "Dry run — built $PLUGIN $VERSION (sha $SHA) and updated the index locally, but opened no PR."
      - name: Report preparation or verification failures
        if: steps.prepare.outputs.failed != '0' || (steps.collect.outputs.failed != '' && steps.collect.outputs.failed != '0')
        run: exit 1

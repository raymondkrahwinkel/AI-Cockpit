name: Publish plugin to store

# A "smart publish button" for a store plugin (#AC). Publishing a plugin has always been a manual chore:
# build Release, zip it, hash it, copy the zip into the separate store repo, hand-edit its index.json, commit.
# This does all of that from one click in the Actions tab — pick a plugin, run — and opens a PR against the
# store repo rather than pushing, so the zip + index diff still gets a human glance before users can install it.
#
# The one thing it refuses to do is publish a plugin the current host cannot run: a plugin whose
# minHostVersion is newer than any published app (release or nightly) would install and then be refused with
# "Needs a newer cockpit", so the gate below blocks it and tells you to ship the app/nightly first. That
# check is the actual point — it moves "will this even work yet?" out of the operator's head and into the
# pipeline. minHostVersion is only as honest as the discipline of bumping it when a plugin starts needing a
# new host API; the gate assumes you do.
#
# It is also callable (workflow_call), which is how publish-updated-plugins.yml ships whatever main carries
# that the store does not have yet. That trigger exists because "deliberately manual" turned out to mean
# "silently skipped": on 2026-07-30 twelve of twenty-four plugins held merged code no published zip contained,
# and the store index reported every one of them up to date. A human judging "is the host out yet" is still the
# right idea — it just cannot be the only thing standing between a fix and the people it was written for. The
# judgement is now the gate below plus the verification before the merge, both of which run every time.
#
# A caller may ask for the store PR to be merged for it (auto_merge). That is only defensible because the
# checks that a reviewer would do are done here first: the zip is re-hashed from disk, its contents are looked
# at, and the index entry is checked against both. The store repo has no workflows and no branch protection,
# so `gh pr merge --auto` would wait for nothing — there is no CI over there to be the second pair of eyes,
# which is exactly why it has to be in this job.

on:
  workflow_call:
    inputs:
      plugin:
        description: The plugin id to publish
        required: true
        # A called workflow cannot take a choice; the dispatch form below keeps the picker for humans.
        type: string
      notes:
        description: Release notes for this version
        required: false
        type: string
      dry_run:
        description: Build, hash and verify, but open no PR
        required: false
        type: boolean
        default: false
      auto_merge:
        description: Merge the store PR once the verification below passes
        required: false
        type: boolean
        default: false
    secrets:
      STORE_PUBLISH_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      plugin:
        description: The plugin id to publish (its plugin.json version is what gets published)
        required: true
        type: choice
        options:
          - autopilot
          - browser
          - claude-provider
          - cli-agent-provider
          - clock
          - depot
          - docker
          - example-workspace
          - fan-out
          - gemini-provider
          - github-actions
          - github-issues
          - github-models-provider
          - github-pull-requests
          - git-status
          - kimi-provider
          - kind
          - kubernetes
          - local-ci
          - prompt-library
          - productivity
          - session-review
          - system-monitor
          - transcript-search
          - usage-trend
          - workflows
          - youtrack
      notes:
        description: Release notes for this version (optional; shown in the store's version history)
        required: false
        type: string
      dry_run:
        description: Build, hash and show the index diff, but do not open a PR
        required: false
        type: boolean
        default: false
      auto_merge:
        description: Merge the store PR once verification passes (leave off to review it yourself)
        required: false
        type: boolean
        default: false

# The store lives in its own repo. STORE_PUBLISH_TOKEN is a fine-grained PAT (or GitHub App token) with
# contents:write + pull-requests:write on that repo — the default GITHUB_TOKEN only reaches this repo.
env:
  STORE_REPO: raymondkrahwinkel/AI-Cockpit-Plugins

permissions:
  contents: read

jobs:
  # AC-1740: a plugin whose store.json names `runtimeIdentifiers` ships one zip per RID, with a self-contained publish
  # of its `subprocess` in each. Only the Windows RIDs need a Windows runner (the SDK embeds an app.manifest only
  # there), so that job runs for such a plugin alone; every other plugin skips it and publishes exactly as before.
  runtime-identifiers:
    runs-on: ubuntu-latest
    outputs:
      dir: ${{ steps.rids.outputs.dir }}
      all: ${{ steps.rids.outputs.all }}
      windows: ${{ steps.rids.outputs.windows }}
      others: ${{ steps.rids.outputs.others }}
      subprocess: ${{ steps.rids.outputs.subprocess }}
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - name: Read the plugin's runtime identifiers from its store.json
        id: rids
        env:
          PLUGIN: ${{ inputs.plugin }}
        shell: bash
        run: |
          set -euo pipefail
          dir=""
          for f in plugins-dev/Cockpit.Plugin.*/plugin.json; do
            if [ "$(jq -r '.id' "$f")" = "$PLUGIN" ]; then dir="$(dirname "$f")"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "::error::No plugin with id '$PLUGIN' found under plugins-dev/."
            exit 1
          fi

          all=""
          subprocess=""
          if [ -f "$dir/store.json" ]; then
            all="$(jq -r '.runtimeIdentifiers // [] | join(" ")' "$dir/store.json")"
            subprocess="$(jq -r '.subprocess // empty' "$dir/store.json")"
          fi
          if [ -n "$all" ] && [ -z "$subprocess" ]; then
            echo "::error::$dir/store.json names runtimeIdentifiers but no subprocess to publish per RID."
            exit 1
          fi

          windows="$(printf '%s\n' $all | grep '^win-' | paste -sd' ' || true)"
          others="$(printf '%s\n' $all | grep -v '^win-' | paste -sd' ' || true)"
          {
            echo "dir=$dir"
            echo "all=$all"
            echo "windows=$windows"
            echo "others=$others"
            echo "subprocess=$subprocess"
          } >> "$GITHUB_OUTPUT"
          echo "Runtime identifiers for '$PLUGIN': ${all:-none, one zip as always}"

  package-windows:
    needs: runtime-identifiers
    if: needs.runtime-identifiers.outputs.windows != ''
    runs-on: windows-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Self-contained: a user's machine has no .NET, and Cockpit's own self-contained folder is no DOTNET_ROOT.
      # arm64 is cross-published from this x64 runner, still on Windows, so it carries the manifest too.
      - name: Publish the subprocess per Windows RID
        env:
          DIR: ${{ needs.runtime-identifiers.outputs.dir }}
          RIDS: ${{ needs.runtime-identifiers.outputs.windows }}
          SUBPROCESS: ${{ needs.runtime-identifiers.outputs.subprocess }}
        shell: bash
        run: |
          set -euo pipefail
          for rid in $RIDS; do
            dotnet publish "$DIR/$(dirname "$SUBPROCESS")" --configuration Release -r "$rid" --self-contained -warnaserror -o "subprocess/$rid"
          done

      - uses: actions/upload-artifact@v7
        with:
          # Per plugin: publish-updated-plugins calls this once per plugin within one run, and names are per run.
          name: subprocess-windows-${{ inputs.plugin }}
          path: subprocess/
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [runtime-identifiers, package-windows]
    # Runs when package-windows was skipped (every plugin without Windows RIDs) or passed; never after it failed.
    if: ${{ !cancelled() && needs.runtime-identifiers.result == 'success' && needs.package-windows.result != 'failure' }}
    runs-on: ubuntu-latest

    steps:
      # Full history + tags: the host-version gate reads the v* release tags and the nightly commit.
      - name: Check out this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check out the store repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.STORE_REPO }}
          token: ${{ secrets.STORE_PUBLISH_TOKEN }}
          path: store

      # Find the plugin folder by its manifest id (not its .csproj name — the two differ), and read the
      # fields the publish needs straight from plugin.json, the source of truth the app enforces. The id
      # arrives via an env var, never interpolated into the script, so nothing it contains can be executed.
      - name: Resolve the plugin from its id
        id: resolve
        env:
          PLUGIN: ${{ inputs.plugin }}
        shell: bash
        run: |
          dir=""
          for f in plugins-dev/Cockpit.Plugin.*/plugin.json; do
            if [ "$(jq -r '.id' "$f")" = "$PLUGIN" ]; then dir="$(dirname "$f")"; break; fi
          done
          if [ -z "$dir" ]; then
            echo "::error::No plugin with id '$PLUGIN' found under plugins-dev/."
            exit 1
          fi

          manifest="$dir/plugin.json"
          {
            echo "dir=$dir"
            echo "manifest=$manifest"
            echo "version=$(jq -r '.version' "$manifest")"
            echo "min_host=$(jq -r '.minHostVersion // ""' "$manifest")"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved '$PLUGIN' -> $dir"

      # The gate. What is the newest host anyone can actually download? The highest v* release, and the base
      # version baked into the current nightly (read from Directory.Build.props at the nightly's commit). If
      # neither reaches the plugin's minHostVersion, the plugin would install and be refused — so stop here.
      - name: Gate on host availability (minHostVersion)
        env:
          GH_TOKEN: ${{ github.token }}
          MIN: ${{ steps.resolve.outputs.min_host }}
          PLUGIN: ${{ inputs.plugin }}
          DIR: ${{ steps.resolve.outputs.dir }}
        shell: bash
        run: |
          if [ -z "$MIN" ]; then
            echo "Plugin declares no minHostVersion — nothing to gate on."
            exit 0
          fi

          stable="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+(\.[0-9]+)*$' | sort -V | tail -1 || true)"

          nightly_base=""
          nsha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/nightly" -q .object.sha 2>/dev/null || echo "")"
          if [ -n "$nsha" ]; then
            # \K drops the tag opener from the match; the [0-9] anchor skips the "<VersionPrefix>" that also
            # appears in a comment in that file, matching only the real element's value.
            nightly_base="$(git show "$nsha:Directory.Build.props" 2>/dev/null | grep -oP '<VersionPrefix>\K[0-9][^<]*' | head -1 || true)"
          fi

          available="$(printf '%s\n%s\n' "$stable" "$nightly_base" | grep -vE '^$' | sort -V | tail -1 || true)"
          echo "Highest stable release: ${stable:-none} · nightly base: ${nightly_base:-none} · newest available host: ${available:-none}"

          if [ -z "$available" ]; then
            echo "::error::Could not determine any published host version (no v* release, no nightly). Cannot verify the plugin will run."
            exit 1
          fi

          lowest="$(printf '%s\n%s\n' "$available" "$MIN" | sort -V | head -1)"
          if [ "$lowest" != "$MIN" ]; then
            echo "::error::$PLUGIN needs host >= $MIN but the newest published host is $available. Publish the app release or nightly that carries the host change first, then re-run this."
            exit 1
          fi

          echo "Gate passed: newest published host $available satisfies minHostVersion $MIN."

          # Second half of the same question. The check above compares numbers; this one asks whether the build
          # carrying that number actually contains the code being published. A nightly's base version is read from
          # Directory.Build.props on main, so the moment VersionPrefix reads 0.17.0 every nightly from then on
          # satisfies minHostVersion 0.17.0 — including one built before the host change a plugin leans on landed.
          # On 2026-08-01 that let claude-provider 0.14.1 through while the newest nightly predated its host half:
          # the plugin would have installed, found no host that states session attendance, and silently kept the old
          # behaviour. A green gate over a dead fix is worse than a refusal, because nobody goes looking.
          #
          # A stable release does not have this problem — it is the version it claims — so the containment check
          # applies only when a nightly is what satisfies the gate.
          if [ -n "$stable" ] && [ "$(printf '%s\n%s\n' "$stable" "$MIN" | sort -V | head -1)" = "$MIN" ]; then
            echo "A stable release ($stable) satisfies minHostVersion — no nightly containment check needed."
            exit 0
          fi

          if [ -z "$nsha" ]; then
            echo "::error::Only a nightly can satisfy minHostVersion $MIN, but there is no nightly tag to check."
            exit 1
          fi

          # The plugin's own newest commit, not the workflow's HEAD: main moves on between a nightly and a publish
          # (an unrelated pull request landing must not block shipping this plugin), while the host change a plugin
          # needs rides in the same commit that bumped its minHostVersion — the discipline this gate already assumes.
          plugin_sha="$(git log -1 --format=%H -- "$DIR")"
          if [ -z "$plugin_sha" ]; then
            echo "::error::Could not determine the newest commit touching $DIR; cannot verify the published host contains it."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$plugin_sha" "$nsha"; then
            echo "::error::The newest published host is nightly $nsha, which does not contain $plugin_sha — the newest commit to $DIR. Its base version satisfies minHostVersion $MIN, but that build predates the code being published, so a plugin leaning on a host change would install and quietly do nothing. Run the Nightly on this commit first, then re-run this."
            exit 1
          fi

          echo "Containment check passed: nightly $nsha contains $plugin_sha (newest commit to $DIR)."

      # A version already in the index is immutable — users may have installed it and pinned its sha256. If it
      # is there, there is nothing to do, and the build/PR steps below are skipped.
      - name: Is this version already published?
        id: check
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          skip=false
          if [ -f store/index.json ]; then
            present="$(jq -r --arg id "$PLUGIN" --arg v "$VERSION" \
              '.plugins[]? | select(.id==$id) | .versions[]?.version | select(.==$v)' store/index.json | head -1)"
            if [ "$present" = "$VERSION" ]; then
              echo "::notice::$PLUGIN $VERSION is already in the store index — nothing to publish."
              skip=true
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Build the plugin (Release)
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: dotnet build "${{ steps.resolve.outputs.dir }}" --configuration Release -warnaserror

      - name: Download the Windows subprocess publishes
        if: steps.check.outputs.skip != 'true' && needs.runtime-identifiers.outputs.windows != ''
        uses: actions/download-artifact@v8
        with:
          name: subprocess-windows-${{ inputs.plugin }}
          path: subprocess

      - name: Publish the subprocess per other RID
        if: steps.check.outputs.skip != 'true' && needs.runtime-identifiers.outputs.others != ''
        env:
          DIR: ${{ steps.resolve.outputs.dir }}
          RIDS: ${{ needs.runtime-identifiers.outputs.others }}
          SUBPROCESS: ${{ needs.runtime-identifiers.outputs.subprocess }}
        shell: bash
        run: |
          set -euo pipefail
          for rid in $RIDS; do
            dotnet publish "$DIR/$(dirname "$SUBPROCESS")" --configuration Release -r "$rid" --self-contained -warnaserror -o "subprocess/$rid"
          done

      # Zip everything the build produced except the .pdb, with plugin.json at the zip root (the layout the
      # installer expects). Shared assemblies are already kept out of the output by ExcludeAssets, so "zip
      # everything" ships the plugin and any real third-party dependency without shipping a host DLL.
      # With runtime identifiers (AC-1740) there is one zip per RID, its subprocess folder swapped for that RID's
      # publish; `rel`/`sha` are then the win-x64 zip, which the index's path/sha256 repeat.
      - name: Package the zip and hash it
        id: package
        if: steps.check.outputs.skip != 'true'
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          DIR: ${{ steps.resolve.outputs.dir }}
          RIDS: ${{ needs.runtime-identifiers.outputs.all }}
          SUBPROCESS: ${{ needs.runtime-identifiers.outputs.subprocess }}
        shell: bash
        run: |
          out="$DIR/bin/Release/net10.0"

          if [ -z "$RIDS" ]; then
            rel="$PLUGIN/$PLUGIN-$VERSION.zip"
            dest="$GITHUB_WORKSPACE/store/$rel"
            mkdir -p "$(dirname "$dest")"
            rm -f "$dest"

            ( cd "$out" && zip -r -X "$dest" . -x '*.pdb' >/dev/null )

            sha="$(sha256sum "$dest" | cut -d' ' -f1)"
            echo "Packaged $rel ($(du -h "$dest" | cut -f1)), sha256 $sha"
            {
              echo "rel=$rel"
              echo "sha=$sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set -euo pipefail
          sub_dir="$(dirname "$SUBPROCESS")"
          packages=""
          rel=""
          for rid in $RIDS; do
            rid_rel="$PLUGIN/$PLUGIN-$VERSION-$rid.zip"
            dest="$GITHUB_WORKSPACE/store/$rid_rel"
            stage="$RUNNER_TEMP/package-$rid"
            mkdir -p "$(dirname "$dest")"
            rm -rf "$dest" "$stage"

            cp -a "$out" "$stage"
            rm -rf "${stage:?}/$sub_dir"
            cp -a "subprocess/$rid" "$stage/$sub_dir"
            case "$rid" in win-*) ;; *) chmod +x "$stage/$SUBPROCESS" ;; esac

            ( cd "$stage" && zip -r -X "$dest" . -x '*.pdb' >/dev/null )

            rid_sha="$(sha256sum "$dest" | cut -d' ' -f1)"
            echo "Packaged $rid_rel ($(du -h "$dest" | cut -f1)), sha256 $rid_sha"
            packages="$packages $rid=$rid_rel:$rid_sha"
            if [ "$rid" = "win-x64" ]; then
              rel="$rid_rel"
              sha="$rid_sha"
            fi
          done

          if [ -z "$rel" ]; then
            echo "::error::runtimeIdentifiers has no win-x64, the package the index's path/sha256 repeat."
            exit 1
          fi
          {
            echo "rel=$rel"
            echo "sha=$sha"
            echo "packages=${packages# }"
          } >> "$GITHUB_OUTPUT"

      - name: Update the store index.json
        if: steps.check.outputs.skip != 'true'
        env:
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
          DIR: ${{ steps.resolve.outputs.dir }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MIN_HOST: ${{ steps.resolve.outputs.min_host }}
          SHA: ${{ steps.package.outputs.sha }}
          REL: ${{ steps.package.outputs.rel }}
          PACKAGES: ${{ steps.package.outputs.packages }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          args=(
            --index store/index.json
            --id "$(jq -r '.id' "$MANIFEST")"
            --name "$(jq -r '.name' "$MANIFEST")"
            --description "$(jq -r '.description // empty' "$MANIFEST")"
            --author "$(jq -r '.author // empty' "$MANIFEST")"
            --version "$VERSION"
            --min-host-version "$MIN_HOST"
            --sha256 "$SHA"
            --path "$REL"
            --published "$(date -u +%Y-%m-%d)"
          )

          abs="$(jq -r '.abstractionsVersion // empty' "$MANIFEST")"
          if [ -n "$abs" ]; then args+=(--abstractions-version "$abs"); fi
          if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); fi
          for package in $PACKAGES; do args+=(--package "$package"); done
          if [ -f "$DIR/store.json" ]; then
            args+=(--store-json "$DIR/store.json")
            echo "Using editorial fields from $DIR/store.json"
          fi

          python3 scripts/store-index-upsert.py "${args[@]}"

          echo "::group::index.json diff"
          git -C store --no-pager diff -- index.json || true
          echo "::endgroup::"

      # What a reviewer of the store PR would actually check, done here so it happens on every publish rather
      # than when someone is paying attention. Each of these has a way of going wrong quietly: an index entry
      # whose sha256 belongs to an earlier build installs and then fails its own integrity check; a zip whose
      # plugin.json is one folder down installs as an empty plugin; a version that is not the newest in the
      # index is one the store will never offer, which is the whole failure this pipeline exists to prevent.
      - name: Verify the zip and the index entry agree
        if: steps.check.outputs.skip != 'true'
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MANIFEST: ${{ steps.resolve.outputs.manifest }}
          REL: ${{ steps.package.outputs.rel }}
          SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          zip_path="store/$REL"

          actual="$(sha256sum "$zip_path" | cut -d' ' -f1)"
          if [ "$actual" != "$SHA" ]; then
            echo "::error::The zip on disk hashes to $actual but the run recorded $SHA."
            exit 1
          fi

          claimed="$(jq -r --arg id "$PLUGIN" --arg v "$VERSION" \
            '.plugins[]? | select(.id==$id) | .versions[]? | select(.version==$v) | .sha256' store/index.json)"
          if [ "$claimed" != "$actual" ]; then
            echo "::error::index.json claims sha256 $claimed for $PLUGIN $VERSION; the zip hashes to $actual."
            exit 1
          fi

          listing="$(unzip -Z1 "$zip_path")"
          if ! grep -qx 'plugin.json' <<<"$listing"; then
            echo "::error::The zip has no plugin.json at its root — the installer would find no manifest."
            exit 1
          fi
          # AC-1390: a plugin split in two names a uiAssembly beside its entryAssembly, and a UI-only plugin names
          # just that one; every assembly the manifest names has to be in the zip.
          for key in entryAssembly uiAssembly; do
            assembly="$(jq -r --arg key "$key" '.[$key] // empty' "$MANIFEST")"
            if [ -n "$assembly" ] && ! grep -qxF "$assembly" <<<"$listing"; then
              echo "::error::The zip has no $assembly at its root, the assembly plugin.json names as its $key."
              exit 1
            fi
          done

          # A published version the store will never offer is the failure this whole pipeline is about, so it
          # is checked rather than assumed: the version going out has to be the highest this plugin has.
          highest="$(jq -r --arg id "$PLUGIN" '.plugins[]? | select(.id==$id) | .versions[]?.version' store/index.json | sort -V | tail -1)"
          if [ "$highest" != "$VERSION" ]; then
            echo "::error::$VERSION is not the newest version of $PLUGIN in the index ($highest is). The store offers only the newest, so this would reach nobody."
            exit 1
          fi

          echo "Verified: $PLUGIN $VERSION · sha256 $actual · manifest and its named assemblies present · newest in the index."

      # AC-1740: every per-RID zip against the index, statically: hashes, a self-contained subprocess, the Windows
      # manifest and the exec bit. The same script runs locally before a change to this route is pushed.
      - name: Verify the per-RID packages
        if: steps.check.outputs.skip != 'true' && needs.runtime-identifiers.outputs.all != ''
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SUBPROCESS: ${{ needs.runtime-identifiers.outputs.subprocess }}
        shell: bash
        run: bash scripts/verify-plugin-packages.sh store "$PLUGIN" "$VERSION" "$SUBPROCESS"

      # Open a PR against the store repo rather than pushing to its main: publishing to a store users install
      # from is outward-facing, and the zip + index diff is exactly what a reviewer wants to see. Dry runs stop
      # before this. The PR body is built into a file so no interpolation lands in a shell string.
      - name: Open a PR against the store repo
        id: pr
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.STORE_PUBLISH_TOKEN }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          MIN_HOST: ${{ steps.resolve.outputs.min_host }}
          SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: |
          branch="publish/$PLUGIN-$VERSION"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          Automated publish from [AI-Cockpit](https://github.com/${GITHUB_REPOSITORY}) run [#${GITHUB_RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          - Plugin: \`$PLUGIN\`
          - Version: \`$VERSION\`
          - minHostVersion: \`$MIN_HOST\`
          - sha256: \`$SHA\`

          Review the added zip and the \`index.json\` diff, then merge to publish.
          EOF

          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # The one zip, or one per RID (AC-1740): both match $PLUGIN-$VERSION*.zip.
          git add "$PLUGIN/$PLUGIN-$VERSION"*.zip index.json
          git commit -m "Publish $PLUGIN $VERSION"
          # A throwaway publish branch; force so a re-run after a failed attempt overwrites cleanly.
          git push --force origin "$branch"

          gh pr create \
            --repo "$STORE_REPO" \
            --head "$branch" \
            --title "Publish $PLUGIN $VERSION" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            || echo "::warning::Branch pushed; a PR may already exist for $branch."

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Merging is what actually publishes: until this happens the plugin exists only on a branch nobody
      # installs from. Plain merge rather than `--auto`, deliberately — auto-merge waits for required checks,
      # and the store repo has none, so asking for it would either merge instantly under a name that suggests
      # otherwise or hang forever on a queue with nothing in it. The verification step above is the gate; this
      # step only exists to stop that verification from ending in a branch someone still has to remember.
      - name: Merge the store PR
        if: steps.check.outputs.skip != 'true' && inputs.dry_run != true && inputs.auto_merge == true
        env:
          GH_TOKEN: ${{ secrets.STORE_PUBLISH_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh pr list --repo "$STORE_REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            echo "::error::No open PR found for branch $BRANCH; refusing to guess which one to merge."
            exit 1
          fi
          gh pr merge "$number" --repo "$STORE_REPO" --squash --delete-branch
          echo "::notice::Published $PLUGIN $VERSION — store PR #$number merged."

      - name: Dry-run summary
        if: steps.check.outputs.skip != 'true' && inputs.dry_run == true
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.package.outputs.sha }}
        shell: bash
        run: echo "Dry run — built $PLUGIN $VERSION (sha $SHA) and updated the index locally, but opened no PR."

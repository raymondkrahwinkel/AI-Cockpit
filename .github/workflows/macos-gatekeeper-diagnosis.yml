# Throwaway: proves scripts/install-macos.sh does what it claims, on a real macOS runner.
# Delete this file before the branch merges — AC-663.
name: macOS install script check

on:
  push:
    branches: [ac-macos-dmg-investigation]
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: A wrong tag fails with a message, not a bare exit code
        run: |
          set +e
          out="$(bash scripts/install-macos.sh no-such-tag-here 2>&1)"; rc=$?
          echo "$out"; echo "exit=$rc"
          echo "$out" | grep -q 'No macos-arm64 .app.zip' || { echo "expected the explanatory message"; exit 1; }
          [ "$rc" = "1" ] || { echo "expected exit 1, got $rc"; exit 1; }

      - name: Install the nightly the way a user would
        run: bash scripts/install-macos.sh nightly

      - name: It landed, unquarantined, with its signature intact
        run: |
          app=/Applications/AI-Cockpit.app
          [ -d "$app" ] || { echo "not installed at $app"; exit 1; }

          echo "=== quarantine flag (must be absent — the whole point) ==="
          if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
            echo "FAIL: quarantined"; exit 1
          fi
          echo "absent"

          # The check that distinguishes this from the `xattr -cr` workaround it replaces: that one left the
          # bundle reading "code object is not signed at all". This must still be valid.
          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tail -3

          echo "=== the app starts ==="
          perl -e 'alarm 20; exec @ARGV' "$app/Contents/MacOS/Cockpit.App" --version 2>&1 | head -3

      - name: Re-running upgrades in place rather than failing
        run: |
          bash scripts/install-macos.sh nightly
          [ -d /Applications/AI-Cockpit.app ] || { echo "gone after reinstall"; exit 1; }
          echo "second run fine"

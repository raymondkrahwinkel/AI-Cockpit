# Throwaway diagnostic workflow for the macOS "app is damaged" reports (AC macOS DMG investigation).
#
# It downloads the *published* nightly .dmg and .app.zip and judges them the way Gatekeeper does, with and
# without the quarantine flag a browser sets. Nothing is built: the question is about the artifact users
# actually get, so the test uses that artifact.
#
# Delete this file once the investigation lands.
name: macOS Gatekeeper diagnosis

on:
  push:
    branches: [ac-macos-dmg-investigation]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-latest
    steps:
      - name: Runner and Gatekeeper state
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "--- spctl --status ---"
          spctl --status || true
          spctl --status --verbose || true
          echo "--- assessment rules (are any bypasses in place?) ---"
          spctl --list --type execute 2>/dev/null | head -20 || true

      # curl, deliberately: the download tool is what decides whether the quarantine flag gets set, and that is
      # half the question.
      - name: Download the published nightly artifacts with curl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/dl && cd ~/dl
          gh release download nightly --repo "$GITHUB_REPOSITORY" \
            --pattern 'ai-cockpit-nightly-macos-arm64.dmg' \
            --pattern 'ai-cockpit-nightly-macos-arm64.app.zip'
          ls -la
          echo "--- xattrs on files fetched by a CLI tool ---"
          xattr -l ai-cockpit-nightly-macos-arm64.dmg  || true
          echo "(dmg: nothing above means no quarantine)"
          xattr -l ai-cockpit-nightly-macos-arm64.app.zip || true
          echo "(zip: nothing above means no quarantine)"

      - name: Signature of the app inside the DMG
        run: |
          cd ~/dl
          hdiutil attach -nobrowse -readonly ai-cockpit-nightly-macos-arm64.dmg -mountpoint /tmp/acdmg
          app=/tmp/acdmg/AI-Cockpit.app
          echo "=== codesign -dv --verbose=4 ==="
          codesign -dv --verbose=4 "$app" 2>&1 || true
          echo "=== codesign --verify --deep --strict --verbose=4 ==="
          codesign --verify --deep --strict --verbose=4 "$app" 2>&1 || true
          echo "=== spctl -a -vvv --type execute (Gatekeeper's verdict) ==="
          spctl -a -vvv --type execute "$app" 2>&1 || true
          echo "=== spctl on the DMG itself (-t open) ==="
          spctl -a -vvv -t open --context context:primary-signature ai-cockpit-nightly-macos-arm64.dmg 2>&1 || true
          hdiutil detach /tmp/acdmg || true

      - name: Case A — unzipped, no quarantine (the CLI/installer route)
        run: |
          rm -rf /tmp/caseA && mkdir -p /tmp/caseA && cd /tmp/caseA
          ditto -x -k ~/dl/ai-cockpit-nightly-macos-arm64.app.zip .
          app=/tmp/caseA/AI-Cockpit.app
          echo "=== xattrs (expect none) ==="
          xattr -lr "$app" | head -20 || true
          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || true
          echo "=== spctl -a -vvv --type execute ==="
          spctl -a -vvv --type execute "$app" 2>&1 || true
          echo "=== syspolicy_check distribution (macOS 14+, what Gatekeeper would tell the user) ==="
          syspolicy_check distribution "$app" 2>&1 || true
          echo "=== does the binary actually start? (5s, expect a display/GUI failure, not a kill) ==="
          timeout 5 "$app/Contents/MacOS/Cockpit.App" --version 2>&1 | head -20; echo "exit=$?"

      - name: Case B — quarantined, as a browser download (the reported failure)
        run: |
          rm -rf /tmp/caseB && mkdir -p /tmp/caseB && cd /tmp/caseB
          ditto -x -k ~/dl/ai-cockpit-nightly-macos-arm64.app.zip .
          app=/tmp/caseB/AI-Cockpit.app
          # 0081 = quarantined, never opened; the shape Chrome/Safari write.
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Chrome;$(uuidgen)" "$app"
          echo "=== quarantine flag set ==="
          xattr -p com.apple.quarantine "$app"
          echo "=== spctl -a -vvv --type execute ==="
          spctl -a -vvv --type execute "$app" 2>&1 || true
          echo "=== syspolicy_check distribution ==="
          syspolicy_check distribution "$app" 2>&1 || true
          echo "=== codesign --verify (is the signature itself still fine?) ==="
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || true

      - name: Case C — quarantined, then the documented xattr -cr workaround
        run: |
          app=/tmp/caseB/AI-Cockpit.app
          xattr -cr "$app"
          echo "=== xattrs after xattr -cr (expect none) ==="
          xattr -lr "$app" | head -10 || true
          echo "=== spctl -a -vvv --type execute ==="
          spctl -a -vvv --type execute "$app" 2>&1 || true
          echo "=== syspolicy_check distribution ==="
          syspolicy_check distribution "$app" 2>&1 || true
          echo "=== codesign --verify --deep --strict (did xattr -cr break the signature?) ==="
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 || true
          echo "=== binary still starts? ==="
          timeout 5 "$app/Contents/MacOS/Cockpit.App" --version 2>&1 | head -20; echo "exit=$?"

      # The hypothesis under test: does `brew install --cask` sidestep Gatekeeper by not quarantining?
      - name: Does Homebrew Cask quarantine what it installs?
        run: |
          echo "=== brew version ==="
          brew --version | head -2
          echo "=== Homebrew's own quarantine code ==="
          sed -n '1,60p' "$(brew --repository)/Library/Homebrew/cask/quarantine.rb" 2>/dev/null || true
          echo "=== where the installer decides ==="
          grep -rn "quarantine" "$(brew --repository)/Library/Homebrew/cask/installer.rb" 2>/dev/null | head -20 || true
          echo "=== the flag users pass to opt out ==="
          grep -rn "no-quarantine" "$(brew --repository)/Library/Homebrew/cmd/install.rb" \
            "$(brew --repository)/Library/Homebrew/cask/config.rb" 2>/dev/null | head -10 || true
          echo "=== empirical: install a small cask and read its xattrs ==="
          brew install --cask --no-binaries db-browser-for-sqlite 2>&1 | tail -5 || true
          for a in /Applications/*.app; do
            printf '%s -> ' "$a"; xattr -p com.apple.quarantine "$a" 2>/dev/null || echo "(no quarantine)"
          done

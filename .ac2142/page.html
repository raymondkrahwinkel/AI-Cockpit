<!doctype html>
<meta charset="utf-8">
<title>AC-2142 deterministic transport workload</title>
<style>
body { margin: 0; height: 20000px; background: repeating-linear-gradient(#ddd 0px, #fff 40px, #78a 80px); }
canvas { position: fixed; top: 0; left: 0; z-index: 2; }
input { position: fixed; top: 40px; left: 20px; z-index: 2; }
</style>
<canvas width="100" height="20"></canvas><input autofocus>
<script>
window.probeId = 1;
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d', { alpha: false });
function marker() {
    context.fillStyle = '#000';
    context.fillRect(0, 0, 100, 20);
    for (let bit = 0; bit < 20; bit++) {
        context.fillStyle = (window.probeId & (1 << bit)) ? '#fff' : '#000';
        context.fillRect(4 + bit * 4, 4, 4, 4);
    }
}
document.querySelector('input').addEventListener('input', marker);
window.addEventListener('wheel', () => requestAnimationFrame(marker), { passive: true });
marker();
</script>
